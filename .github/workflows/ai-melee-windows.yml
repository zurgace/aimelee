name: AI-Melee Windows release

# Builds the Windows x86-64 game exactly as the Build workflow's windows job
# does, adds the Python agent (tools/agent/package_windows_agent.sh) and, for
# an ai-melee-v* tag, publishes AI-Melee-Windows-x86_64.zip as a GitHub
# Release. Separate from Build because that workflow's release job needs every
# platform, including signing secrets this fork does not have; the tag prefix
# keeps it from matching Build's v* tags.
on:
  push:
    tags: ['ai-melee-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (x86_64) + agent
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake zip unzip cabextract curl mingw-w64 python3-numpy
          # aurora's C++20 code needs std::thread, which only the POSIX
          # threading model provides; Ubuntu defaults some links to win32.
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Agent tests
        run: python3 -m unittest discover -s tools/agent/tests -v

      - name: Build and package the game
        env:
          TARGET_ARCH: x86_64
        run: tools/package_windows.sh

      - name: Add the agent
        run: tools/agent/package_windows_agent.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ai-melee-windows-x86_64
          path: dist/AI-Melee-Windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: [windows]
    if: startsWith(github.ref, 'refs/tags/ai-melee-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ai-melee-windows-x86_64
          path: artifacts

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -lh artifacts
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" artifacts/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "AI-Melee ${GITHUB_REF_NAME#ai-melee-}" \
              --notes-file tools/agent/RELEASE_NOTES.md \
              artifacts/*.zip
          fi
